name: UI tests

# Two jobs:
# - build:    every push and pull request. Restores, builds and lists the tests, so a change that
#             breaks the code or the feature files is caught straight away.
# - ui-tests: on demand only. Runs the suite against the live TfL site. TfL's bot protection shows a
#             "Verification required" page to GitHub's hosted runners (seen on 14 Oct 2026), so the
#             UI tests can't run there automatically. The job is kept so it can be run by hand, and
#             it fails fast with a clear message if the check appears.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"

jobs:
  build:
    # Pinned rather than ubuntu-latest, so a runner image change can't alter results without notice.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build
        run: dotnet build --configuration Release

      # Proves every feature file was turned into tests and compiles. Expect 8 tests.
      - name: List the tests
        run: dotnet test --configuration Release --no-build --list-tests

  ui-tests:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      TFLTESTS_Headless: "true"

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build
        run: dotnet build --configuration Release

      # Google Chrome is already installed on GitHub's Ubuntu runners, and the tests use the
      # "chrome" channel, so there is no browser download step.
      - name: Check Chrome is available
        run: google-chrome --version

      # The smoke test runs first. If the setup is broken or TfL blocks the runner, this step fails
      # and the journey tests are skipped, which saves time and makes the cause obvious.
      - name: Smoke test
        run: >
          dotnet test --configuration Release --no-build
          --filter "Category=smoke"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=smoke.trx"
          --results-directory TestResults

      - name: Journey planner tests
        run: >
          dotnet test --configuration Release --no-build
          --filter "Category!=smoke"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=journey-planner.trx"
          --results-directory TestResults

      # Always keep the results. On a failure this includes the screenshot and the Playwright
      # trace for each failed scenario, which can be opened at trace.playwright.dev.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/
            tests/TflJourneyPlanner.UiTests/bin/Release/net10.0/TestResults/failures/
          if-no-files-found: ignore
          retention-days: 14
